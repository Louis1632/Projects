# Validation only: nothing here publishes images or deploys.
name: TiDo CI

on:
  push:
    branches: [main]
    paths: ['TiDo/**', '.github/workflows/tido-ci.yml']
  pull_request:
    paths: ['TiDo/**', '.github/workflows/tido-ci.yml']

permissions:
  contents: read

concurrency:
  group: tido-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: TiDo

env:
  DATABASE_URL: postgresql://tido:tido@localhost:5432/tido
  TEST_DATABASE_URL: postgresql://tido:tido@localhost:5432/tido_test
  E2E_DATABASE_URL: postgresql://tido:tido@localhost:5432/tido_e2e

jobs:
  checks:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: TiDo/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TiDo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: No known high-severity vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tido
          POSTGRES_PASSWORD: tido
          POSTGRES_DB: tido
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tido -d tido" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: TiDo/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TiDo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Schema and committed migrations agree
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle || (echo "::error::Run pnpm db:generate and commit the migration" && exit 1)
      - name: Migration smoke test (fresh database, then re-run)
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tido
          POSTGRES_PASSWORD: tido
          POSTGRES_DB: tido
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tido -d tido" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: TiDo/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TiDo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tido/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: TiDo/apps/web/playwright-report
          retention-days: 7

  containers:
    name: Container images and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: TiDo
          file: TiDo/apps/api/Dockerfile
          tags: tido-api:ci
          load: true
          push: false
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: TiDo
          file: TiDo/apps/web/Dockerfile
          tags: tido-web:ci
          load: true
          push: false
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id tido-api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id tido-web:ci -u)" = "101"
      - name: Web container serves the app and health check
        run: |
          docker run -d --name web --read-only --tmpfs /tmp -p 8080:8080 tido-web:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/tasks | grep -q '<div id="root">'
          # Every security header on both the app shell and the hashed assets (TIDO-SEC-006).
          for path in / /tasks "/assets/$(docker exec web ls /usr/share/nginx/html/assets | head -1)"; do
            headers="$(curl -fsSI "localhost:8080${path}")"
            for header in content-security-policy permissions-policy cross-origin-opener-policy strict-transport-security referrer-policy; do
              grep -qi "^${header}:" <<<"$headers" || { echo "::error::${path} lacks ${header}"; exit 1; }
            done
          done
      - name: Kustomize overlays render
        run: |
          kubectl kustomize deploy/k8s/overlays/staging > /dev/null
          kubectl kustomize deploy/k8s/overlays/production > /dev/null
