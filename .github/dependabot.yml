# Weekly update PRs for TiDo's dependencies, base images and the CI actions (pinned to commit
# SHAs, which Dependabot keeps current). See TiDo/docs/security.md (TIDO-SEC-010).
version: 2
updates:
  - package-ecosystem: npm
    directory: /TiDo
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/TiDo/apps/api, /TiDo/apps/web]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
