# Included in every location of nginx.conf. nginx drops all server-level add_header lines in any
# location that has its own add_header, so the headers live here instead (docs/security.md, TIDO-SEC-006).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The app is only ever served over HTTPS (Traefik terminates TLS).
add_header Strict-Transport-Security "max-age=31536000" always;
