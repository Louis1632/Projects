# The k6 load generator (deploy/k8s/jobs/loadgen-job.yaml) may call the API and web pods, and
# nothing else. Network policies add up, so these sit alongside the base's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-loadgen-to-app
  labels:
    tido.io/phase: platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [tido-api, tido-web]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tido-loadgen
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-loadgen-egress
  labels:
    tido.io/phase: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tido-loadgen
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [tido-api, tido-web]
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
