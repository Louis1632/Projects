# Staging: reachable only over Tailscale, on port 8443 of the same Tailscale name and certificate
# as production (https://<name>.ts.net:8443), so it can be tested from a phone. The port is
# Traefik's "staging" entry point, from homelab-platform's platform/traefik-config.yaml.
# Released with deploy/scripts/release-staging.sh, which writes the image digests and the
# hostname below. See docs/runbooks/staging-release.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tido-staging
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: Ingress
      name: tido
    path: ingress-patch.yaml
  - path: config-patch.yaml
  # Port 8443 and Tailscale addresses only (base/tailnet-only.yaml). Kept out of
  # ingress-patch.yaml, whose values release-staging.sh rewrites.
  - target:
      kind: Ingress
      name: tido
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: staging
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: tido-staging-tailnet-only@kubernetescrd
# Written by deploy/scripts/release-staging.sh: exact digests of the released images.
images:
  - name: tido-api
    newName: localhost:5000/tido/api
    digest: sha256:a34545558fb5a8449d5c2927a10be107832d5b3a63057131ca0cd0c8cb41ef32
  - name: tido-web
    newName: localhost:5000/tido/web
    digest: sha256:28bd2afdc3bc53541a30e57e60207d72ab073e1363b1b0f377485f3453fff487
