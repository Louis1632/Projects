# Plain HTTP on the production hostname redirects to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    tido.io/phase: platform
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tido-http-redirect
  labels:
    tido.io/phase: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # <namespace>-<middleware>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: tido-production-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tido.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tido-web
                port:
                  name: http
