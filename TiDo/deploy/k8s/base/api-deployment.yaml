apiVersion: apps/v1
kind: Deployment
metadata:
  name: tido-api
  labels:
    app.kubernetes.io/name: tido-api
    tido.io/phase: app
spec:
  # One replica: login throttling is in-process. Scale out only after moving it to the DB.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: tido-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tido-api
        app.kubernetes.io/part-of: tido
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tido-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            # Prometheus /metrics, reachable only from the monitoring namespace.
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: tido-api-config
          env:
            # Trace attributes, so Tempo can tell staging from production.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tido-db-app
                  key: uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tido-api-secrets
                  key: session-secret
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
