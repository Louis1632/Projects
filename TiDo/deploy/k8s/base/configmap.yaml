apiVersion: v1
kind: ConfigMap
metadata:
  name: tido-api-config
  labels:
    tido.io/phase: platform
data:
  NODE_ENV: production
  API_PORT: '3000'
  WEB_ORIGIN: https://tido-staging.home.arpa
  COOKIE_SECURE: 'true'
  SESSION_COOKIE_NAME: __Host-tido_session
  # One hop: Traefik. Clients cannot pick their own IP with a forged X-Forwarded-For.
  TRUST_PROXY: '1'
  WORKSPACE_TIMEZONE: Africa/Johannesburg
  LOG_LEVEL: info
  METRICS_PORT: '9464'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc:4318
