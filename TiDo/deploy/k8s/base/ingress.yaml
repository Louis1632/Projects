apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tido
  labels:
    tido.io/phase: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tido.invalid
      secretName: tido-tls
  rules:
    - host: tido.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tido-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tido-web
                port:
                  name: http
