# Deny all ingress by default, then allow only the paths TiDo needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-default-deny-ingress
  labels:
    tido.io/phase: platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The ingress controller (Traefik in kube-system) reaches the web and API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-web-ingress
  labels:
    tido.io/phase: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tido-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-api-ingress
  labels:
    tido.io/phase: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tido-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
---
# PostgreSQL accepts connections only from the API and migration jobs, plus the
# CloudNativePG operator's status checks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tido-db-ingress
  labels:
    tido.io/phase: platform
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: tido-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [tido-api, tido-migrate, tido-bootstrap]
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
