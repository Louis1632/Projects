# Template rendered by deploy/scripts/bootstrap-owner.sh. Creates the first owner once
# and prints a single-use setup link to the job log, which the script then deletes.
apiVersion: batch/v1
kind: Job
metadata:
  name: tido-bootstrap
  labels:
    app.kubernetes.io/name: tido-bootstrap
    app.kubernetes.io/part-of: tido
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tido-bootstrap
        app.kubernetes.io/part-of: tido
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: __API_IMAGE__
          command: ['node', 'dist/cli/bootstrap-owner.js']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tido-db-app
                  key: uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tido-api-secrets
                  key: session-secret
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tido-api-config
                  key: WEB_ORIGIN
            - name: WORKSPACE_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: tido-api-config
                  key: WORKSPACE_TIMEZONE
            - name: BOOTSTRAP_OWNER_EMAIL
              value: __OWNER_EMAIL__
            - name: BOOTSTRAP_OWNER_NAME
              value: __OWNER_NAME__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
