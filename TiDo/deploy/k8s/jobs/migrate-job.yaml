# Template rendered by deploy/scripts/release-staging.sh once per release.
# __RELEASE__ and __API_IMAGE__ are replaced; the job must finish before the API rolls out.
apiVersion: batch/v1
kind: Job
metadata:
  name: tido-migrate-__RELEASE__
  labels:
    app.kubernetes.io/name: tido-migrate
    app.kubernetes.io/part-of: tido
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tido-migrate
        app.kubernetes.io/part-of: tido
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __API_IMAGE__
          command: ['node', 'dist/cli/migrate.js']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tido-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
